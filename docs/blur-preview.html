<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель скрытого адреса</title>
<style>
  :root { --bg:#0A0F14; --card:#111A22; --text:#E6F1F8; --muted:#7B9AB0; --accent:#00B4FF; }
  body { margin:0; background:var(--bg); font-family:Inter,'Segoe UI',sans-serif; color:var(--text);
         padding:22px; display:flex; flex-direction:column; gap:18px; align-items:center; }
  .title { font-size:13px; color:var(--muted); }
  .card { width:360px; background:var(--card); border:1px solid #1B2C3A; border-radius:16px; padding:16px; }
  .label { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:500; margin-bottom:10px; }
  .badge { font-size:10px; color:var(--accent); background:rgba(0,180,255,.12); padding:2px 8px; border-radius:99px; }

  .panel { position:relative; height:44px; border-radius:10px; overflow:hidden; background:var(--card); }
  .bubbles { position:absolute; inset:-18px; animation:drift 6s ease-in-out infinite alternate; }
  .bubbles i { position:absolute; border-radius:50%;
               background:radial-gradient(circle, var(--accent) 0%, rgba(0,180,255,0) 70%); }
  @keyframes drift { 0%{transform:translate(-7px,4px)} 100%{transform:translate(7px,-4px)} }

  .veil { position:absolute; inset:0; background:var(--card); opacity:.34; }
  .f { position:absolute; pointer-events:none; }
  .f.t { inset:0 0 auto 0; background:linear-gradient(var(--card),transparent); }
  .f.b { inset:auto 0 0 0; background:linear-gradient(transparent,var(--card)); }
  .f.l { inset:0 auto 0 0; background:linear-gradient(90deg,var(--card),transparent); }
  .f.r { inset:0 0 0 auto; background:linear-gradient(270deg,var(--card),transparent); }
  .lock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:.75; }

  .row { display:flex; align-items:center; margin-top:8px; }
  .hint { font-size:11px; color:#54657A; flex:1; }
  .change { font-size:12px; font-weight:600; color:var(--accent); margin-left:10px; }
</style>
</head>
<body>
  <div class="title">Так панель выглядит в приложении</div>

  <div class="card">
    <div class="label">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7B9AB0" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Адрес роутера <span class="badge">ВНЕШНЯЯ ССЫЛКА</span>
    </div>

    <div class="panel">
      <div class="bubbles" id="b1"></div>
      <div class="veil"></div>
      <div class="f t" style="height:12px"></div><div class="f b" style="height:12px"></div>
      <div class="f l" style="width:12px"></div><div class="f r" style="width:12px"></div>
      <div class="lock"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E6F1F8" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></div>
    </div>

    <div class="row">
      <span class="hint">Нажмите, чтобы показать · удерживайте, чтобы скопировать</span>
      <span class="change">Изменить</span>
    </div>
  </div>

  <div class="title">Крупно — видно мягкость шариков и краёв</div>

  <div class="card">
    <div class="panel" style="height:96px;border-radius:12px">
      <div class="bubbles" id="b2"></div>
      <div class="veil" style="opacity:.3"></div>
      <div class="f t" style="height:24px"></div><div class="f b" style="height:24px"></div>
      <div class="f l" style="width:24px"></div><div class="f r" style="width:24px"></div>
      <div class="lock"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E6F1F8" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></div>
    </div>
  </div>

<script>
  // Те же шарики и те же параметры, что в BlurPanel.tsx
  function noise(seed){ const v = Math.sin(seed*12.9898)*43758.5453; return v - Math.floor(v); }
  const B = Array.from({length:34},(_,i)=>{
    const r1=noise(i+1), r2=noise((i+1)*1.7+11), r3=noise((i+1)*2.3+29), r4=noise((i+1)*3.1+53);
    return {x:r1,y:r2,r:2.5+r3*5.5,o:.26+r4*.34};
  });
  function fill(hostId, w, h, over) {
    const host = document.getElementById(hostId);
    for (const b of B) {
      const i = document.createElement('i');
      const size = b.r*2;
      i.style.width = i.style.height = size + 'px';
      i.style.left = (over + b.x*w - b.r) + 'px';
      i.style.top  = (over + b.y*h - b.r) + 'px';
      i.style.opacity = b.o;
      host.appendChild(i);
    }
  }
  fill('b1', 328, 44, 18);
  fill('b2', 328, 96, 18);
</script>
</body>
</html>
